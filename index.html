<title>Wonderland – Letak Betul-Betul!</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Georgia,'Palatino Linotype',serif;color:#fff;user-select:none}
body{background:radial-gradient(circle at 20% 10%,#4b2a7a 0,#241046 45%,#120826 100%)}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;justify-content:space-between;align-items:center;padding:1.2vh 2.2vw;background:rgba(0,0,0,.3);border-bottom:3px solid rgba(245,197,66,.55);gap:2vw}
header .t{font-size:clamp(18px,2.6vw,40px);font-weight:bold;letter-spacing:.5px}
header .t small{display:block;font-size:.55em;font-weight:normal;color:#cdb8ee;font-style:italic}
#timer{font:bold clamp(34px,5.2vw,84px)/1 'Courier New',monospace;color:#f5c542;text-shadow:0 0 18px rgba(245,197,66,.45);min-width:6.2ch;text-align:right}
#wrap{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0}
#bar{position:absolute;left:0;right:0;bottom:0;padding:1.4vh 2vw;display:none;align-items:center;justify-content:space-between;gap:2vw;background:linear-gradient(0deg,rgba(10,4,24,.92),rgba(10,4,24,.6));font-size:clamp(16px,1.8vw,28px)}
#bar b{color:#f5c542}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:.55em 1.2em;background:linear-gradient(#ffd865,#f0a92a);color:#3a1c00;font-weight:bold;box-shadow:0 4px 0 #a86a10,0 8px 18px rgba(0,0,0,.4)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a86a10}
button.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.35)}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(12,5,30,.72);z-index:5}
.card{background:linear-gradient(#35205c,#26153f);border:3px solid #f5c542;border-radius:26px;padding:3vh 3vw;max-width:min(94vw,1100px);max-height:94%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center}
.card h1{margin:0 0 .3em;font-size:clamp(28px,4.2vw,64px);color:#f5c542;line-height:1.1}
.card h2{margin:.2em 0;font-size:clamp(22px,2.8vw,44px)}
.card p{font-size:clamp(15px,1.7vw,26px);margin:.5em 0;color:#e6d9fb}
.row{display:flex;gap:1.2vw;justify-content:center;flex-wrap:wrap;margin:1.2vh 0}
input[type=text]{font:inherit;font-size:clamp(18px,2vw,30px);padding:.4em .6em;border-radius:12px;border:2px solid #8a6cc4;background:#1a0d33;color:#fff;width:12em;text-align:center}
input[type=range]{width:min(60vw,420px)}
table{border-collapse:collapse;margin:1vh auto;font-size:clamp(15px,1.8vw,28px)}
th,td{padding:.35em .9em;border-bottom:1px solid rgba(255,255,255,.18)}
th{color:#f5c542;font-weight:normal;font-style:italic}
td.n{text-align:left}td.v{text-align:right;font-family:'Courier New',monospace}

let ORDER=['hatter','cat','queen'];
const META={
 hatter:{name:'Mad Hatter',item:'topi',start:[-330,170]},
 cat:{name:'Cheshire Cat',item:'ekor',start:[210,140]},
 queen:{name:'Queen of Hearts',item:'mahkota',start:[-300,210]},
 rabbit:{name:'White Rabbit',item:'jam poket',start:[-260,-40]},
 hare:{name:'March Hare',item:'tali leher',start:[220,40]}
};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ROUNDS=3, TEAMS=1, TIME_LIMIT=60, PEN_PER_BODY=25, TOL=0.04;
const IMG={};
let teams=['Team 1','Team 2','Team 3'], sens=1.5;
try{const s=JSON.parse(localStorage.getItem('wl_cfg')||'null');if(s){teams=s.teams||teams;sens=s.sens||sens}}catch(e){}
teams=[(teams[0]||'Team 1')];

let state='loading', turn=0, pos={x:0,y:0}, t0=0, elapsed=0, snap=null, last=null;
let results=[...Array(TEAMS)].map(()=>Array(ROUNDS).fill(null));
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const $=id=>document.getElementById(id);
let cw=0,ch=0;

function resize(){const dpr=window.devicePixelRatio||1,r=cv.parentElement.getBoundingClientRect();cw=r.width;ch=r.height;cv.width=cw*dpr;cv.height=ch*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);

let ac;
function beep(f,d=.14,type='sine',v=.16){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.value=f;gn.gain.value=v;o.connect(gn);gn.connect(ac.destination);o.start();gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}

const round=()=>Math.floor(turn/TEAMS), team=()=>turn%TEAMS, key=()=>ORDER[round()];
function geom(){const d=DATA[key()];const s=Math.min(ch*.78/d.H,cw*.5/d.W);return{d,s,ox:(cw-d.W*s)/2,oy:(ch-d.H*s)/2-ch*.03}}
function startPos(){const d=DATA[key()],m=META[key()];pos={x:d.ix+m.start[0],y:d.iy+m.start[1]};clamp()}
function clamp(){const {d,s,ox,oy}=geom();
 const minX=-ox/s, maxX=(cw-ox)/s-d.iw, minY=-oy/s, maxY=(ch-oy)/s-d.ih;
 pos.x=Math.max(minX,Math.min(maxX,pos.x));pos.y=Math.max(minY,Math.min(maxY,pos.y))}

function floor(){const n=14,tw=cw/n,top=ch*.86;
 for(let r=0;top+r*tw*.35<ch;r++)for(let c=0;c<n;c++){g.fillStyle=(r+c)%2?'rgba(255,255,255,.07)':'rgba(0,0,0,.18)';g.fillRect(c*tw,top+r*tw*.35,tw+1,tw*.35+1)}
 const suits=['♠','♥','♦','♣'];g.font=Math.round(ch*.05)+'px Georgia';g.fillStyle='rgba(255,255,255,.07)';
 for(let i=0;i<14;i++){g.fillText(suits[i%4],(i*137%100)/100*cw,(i*53%70)/100*ch*.8+ch*.08)}}

function roundRect(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

function draw(now){
 requestAnimationFrame(draw);
 g.clearRect(0,0,cw,ch);floor();
 if(state==='loading'||state==='setup'||state==='final'||!IMG[key()])return;
 const {d,s,ox,oy}=geom();
 g.drawImage(IMG[key()].body,ox,oy,d.W*s,d.H*s);
 // target hint
 const tx=ox+d.ix*s,ty=oy+d.iy*s,tw=d.iw*s,th=d.ih*s,pulse=.5+.5*Math.sin(now/260);
 if(state!=='result'){
  g.save();g.globalAlpha=.22;g.drawImage(IMG[key()].item,tx,ty,tw,th);g.restore();
  g.save();g.strokeStyle='rgba(245,197,66,'+(.55+.45*pulse)+')';g.lineWidth=4;g.setLineDash([16,10]);g.shadowColor='#f5c542';g.shadowBlur=10+14*pulse;
  roundRect(tx-8,ty-8,tw+16,th+16,14);g.stroke();g.restore();
 }
 // snap animation
 if(snap){const k=Math.min(1,(now-snap.t)/700),e=1-Math.pow(1-k,3);pos.x=snap.fx+(d.ix-snap.fx)*e;pos.y=snap.fy+(d.iy-snap.fy)*e}
 // item
 const ix=ox+pos.x*s,iy=oy+pos.y*s;
 if(state==='play'||state==='countdown'||state==='ready'||state==='result'){
  g.save();g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=22;g.shadowOffsetY=10;
  if(state==='play'){g.translate(ix+tw/2,iy+th/2);g.rotate(Math.sin(now/200)*.03);g.translate(-tw/2,-th/2);g.drawImage(IMG[key()].item,0,0,tw,th)}
  else g.drawImage(IMG[key()].item,ix,iy,tw,th);
  g.restore();
 }
 if(state==='play'){elapsed=(performance.now()-t0)/1000;$('timer').textContent=elapsed.toFixed(2);if(elapsed>=TIME_LIMIT)place()}
}

addEventListener('mousemove',e=>{
 if(state!=='play')return;
 const {s}=geom();pos.x+=e.movementX*sens/s;pos.y+=e.movementY*sens/s;clamp()});
cv.addEventListener('mousedown',e=>{if(state==='play'&&e.button===0){e.preventDefault();place()}});

function lock(){try{cv.requestPointerLock&&cv.requestPointerLock()}catch(e){}}
function unlock(){try{document.exitPointerLock&&document.exitPointerLock()}catch(e){}}

function setBar(html){const b=$('bar');if(html){b.innerHTML=html;b.style.display='flex'}else b.style.display='none'}
function show(html,side){$('card').innerHTML=html;$('ov').className=side?'side':'';$('ov').style.display='flex'}
function hide(){$('ov').style.display='none'}

function totals(){return teams.map((n,i)=>{const r=results[i];const done=r.filter(x=>x);return{i,name:n,total:done.reduce((a,x)=>a+x.total,0),n:done.length}})}
function board(){const t=totals().filter(x=>x.n>0).sort((a,b)=>(b.n-a.n)||(a.total-b.total));
 return '<table><tr><th>#</th><th>Team</th><th>Round siap</th><th>Jumlah masa</th></tr>'+t.map((x,k)=>`<tr class="${k==0?'first':''}"><td>${k+1}</td><td class="n">${esc(x.name)}</td><td>${x.n}/${ROUNDS}</td><td class="v">${x.total.toFixed(2)}s</td></tr>`).join('')+'</table>'}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function showSetup(){
 state='setup';hide();setBar('');$('hm').textContent='';$('timer').textContent='0.00';unlock();
 show(`<h1>Wonderland<br>Letak Betul-Betul!</h1>
 <p>${ROUNDS} round · pemain tak tengok skrin, team bagi arahan</p>
 <p style="margin-bottom:0">Nama team</p>
 <div class="row">${teams.map((n,i)=>`<input type="text" id="tn${i}" value="${esc(n)}" maxlength="20">`).join('')}</div>
 <p>Kepekaan mouse: <b id="sv">${sens.toFixed(1)}</b><br><input type="range" id="sens" min="0.5" max="3" step="0.1" value="${sens}"></p>
 <div class="row"><button id="go">Mula Game <span class="kbd">Space</span></button></div>
 <p style="font-size:.8em;opacity:.8">Tip: tekan <span class="kbd">F</span> untuk fullscreen</p>`);
 $('sens').oninput=e=>{sens=+e.target.value;$('sv').textContent=sens.toFixed(1)};
 $('go').onclick=startGame;
}
function startGame(){
 teams=teams.map((_,i)=>($('tn'+i).value.trim()||'Team '+(i+1)));
 try{localStorage.setItem('wl_cfg',JSON.stringify({teams,sens}))}catch(e){}
 results=[...Array(TEAMS)].map(()=>Array(ROUNDS).fill(null));turn=0;ORDER=shuffle(Object.keys(META)).slice(0,ROUNDS);beep(660);showReady();
}
function showReady(){
 state='ready';hide();startPos();snap=null;$('timer').textContent='0.00';
 $('hm').innerHTML=`Round ${round()+1}/${ROUNDS} · ${META[key()].name}<small>Giliran: <b style="color:#f5c542">${esc(teams[team()])}</b></small>`;
 setBar(`<div>Pemain duduk &amp; <b>jangan tengok TV</b>. Letak <b>${META[key()].item}</b> kat tempat bertanda. Team bagi arahan: kiri / kanan / atas / bawah.</div><button id="rb">Mula <span class="kbd">Space</span></button>`);
 $('rb').onclick=countdown;
}
function countdown(){
 if(state!=='ready')return;state='countdown';setBar('');lock();
 let n=3;const tick=()=>{
  if(n>0){show(`<div class="big">${n}</div>`);beep(440);n--;setTimeout(tick,900)}
  else{show(`<div class="big">GO!</div>`);beep(880,.3,'square');setTimeout(()=>{hide()},450);state='play';t0=performance.now();}
 };tick();
}
function place(){
 if(state!=='play')return;
 state='result';elapsed=(performance.now()-t0)/1000;unlock();
 const d=DATA[key()];
 const dist=Math.hypot(pos.x-d.ix,pos.y-d.iy);
 const pen=Math.max(0,dist-TOL*d.H)/d.H*PEN_PER_BODY;
 const time=Math.min(elapsed,TIME_LIMIT);
 const r={time,pen,total:time+pen,dist};results[team()][round()]=r;
 snap={t:performance.now(),fx:pos.x,fy:pos.y};
 $('timer').textContent=time.toFixed(2);beep(pen<.01?990:520,.25,'triangle');
 setTimeout(()=>showResult(r,dist/d.H),800);
}
function showResult(r,rel){
 if(state!=='result')return;
 const cls=rel<=TOL?'good':rel<=.15?'mid':'bad';
 const txt=rel<=TOL?'TEPAT SANGAT! 🎯':rel<=.15?'Dekat dah!':'Jauh lagi…';
 const last=turn===ROUNDS*TEAMS-1;
 show(`<div class="rate ${cls}">${txt}</div>
 <h2>${esc(teams[team()])} · ${META[key()].name}</h2>
 <table><tr><td class="n">Masa</td><td class="v">${r.time.toFixed(2)}s</td></tr><tr><td class="n">Penalti jarak</td><td class="v">+${r.pen.toFixed(2)}s</td></tr><tr class="first"><td class="n">Skor round ni</td><td class="v">${r.total.toFixed(2)}s</td></tr></table>
 <p>Jumlah setakat ni: <b style="color:#f5c542">${totals()[0].total.toFixed(2)}s</b> (${totals()[0].n}/${ROUNDS} round)</p>
 <div class="row"><button id="nx">${last?'Keputusan Akhir':'Seterusnya'} <span class="kbd">Space</span></button><button class="ghost" id="rd">Ulang giliran <span class="kbd">R</span></button></div>`,true);
 $('nx').onclick=next;$('rd').onclick=redo;
}
function redo(){if(state!=='result')return;results[team()][round()]=null;showReady()}
function next(){if(state!=='result')return;snap=null;turn++;if(turn>=ROUNDS*TEAMS)showFinal();else showReady()}
function showFinal(){
 state='final';setBar('');$('hm').textContent='Selesai';$('timer').textContent='';
 const tot=totals()[0].total;
 show(`<h1>Selesai! 🎉</h1><h2>${esc(teams[0])}</h2>
 <table><tr><th>Round</th><th>Watak</th><th>Masa</th><th>Penalti</th><th>Skor</th></tr>
 ${results[0].map((r,k)=>`<tr><td>${k+1}</td><td class="n">${META[ORDER[k]].name}</td><td class="v">${r.time.toFixed(2)}s</td><td class="v">+${r.pen.toFixed(2)}s</td><td class="v">${r.total.toFixed(2)}s</td></tr>`).join('')}</table>
 <p style="margin:.2em 0 0">Jumlah masa</p><div class="total">${tot.toFixed(2)}s</div>
 <div class="row"><button id="again">Main Semula <span class="kbd">Space</span></button></div>`);
 beep(660,.2);setTimeout(()=>beep(880,.2),200);setTimeout(()=>beep(1100,.35),400);
 $('again').onclick=showSetup;
}
addEventListener('keydown',e=>{
 const k=e.key;
 if(e.target&&e.target.tagName==='INPUT'&&k!=='Enter')return;
 if(k===' '||k==='Enter'){e.preventDefault();
  if(state==='setup')startGame();else if(state==='ready')countdown();else if(state==='result')next();else if(state==='final')showSetup()}
 else if((k==='r'||k==='R')&&state==='result')redo();
 else if((k==='f'||k==='F')){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
});

async function init(){
 resize();
 await Promise.all(Object.keys(DATA).flatMap(k=>['body','item'].map(p=>new Promise(res=>{const im=new Image();im.onload=res;im.src=DATA[k][p];(IMG[k]=IMG[k]||{})[p]=im}))));
 showSetup();requestAnimationFrame(draw);
}
init();
</script>
